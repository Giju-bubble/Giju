version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: "<TASK_DEFINITION>"
        LoadBalancerInfo:
          ContainerName: "giju-container"
          ContainerPort: 8080
        PlatformVersion: "LATEST"

hooks:
  AfterInstall:
    - location: scripts/success.sh
      timeout: 30
      runas: root